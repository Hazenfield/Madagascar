services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: madagascar
      POSTGRES_PASSWORD: madagascar
      POSTGRES_DB: madagascar
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U madagascar -d madagascar"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
